<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CYBERSHIELD - AI-Powered Digital Safety & Threat Detection">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="cybershield">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CYBERSHIELD</title>
  <link rel="manifest" href="manifest.json">

  <!-- Tesseract.js -->
  <script src="https://unpkg.com/tesseract.js@v4.0.2/dist/tesseract.min.js"></script>

  <script>
    async function _extractText(imagePath, mapData) {
      try {
        var worker = await Tesseract.createWorker();

        await worker.load();
        await worker.loadLanguage(mapData.language);
        await worker.initialize(mapData.language);

        if (mapData.args) {
          await worker.setParameters(mapData.args);
        }

        var result = await worker.recognize(imagePath);

        await worker.terminate();

        if (mapData.args &&
            mapData.args["tessjs_create_hocr"]) {
          return result.data.hocr;
        }

        return result.data.text;
      } catch (error) {
        console.error("Tesseract OCR error:", error);
        throw error;
      }
    }
  </script>
</head>

<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
